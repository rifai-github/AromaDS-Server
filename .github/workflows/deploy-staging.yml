name: Deploy Staging

on:
  push:
    branches:
      - develop

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Pull latest code on staging
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
      DEPLOY_PORT: ${{ secrets.STAGING_PORT || '22' }}
      DEPLOY_USER: deploy
      DEPLOY_PATH: /var/www/aroma-staging

    steps:
      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Pull latest develop branch
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "bash -s" <<'EOF'
          set -euo pipefail

          cd /var/www/aroma-staging

          git config core.fileMode false
          git fetch origin develop
          git pull --ff-only origin develop

          php artisan migrate --force
          EOF
