name: Deploy Staging

on:
  workflow_dispatch:
  push:
    branches:
      - develop

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Pull latest code on staging
    runs-on: self-hosted

    steps:
      - name: Deploy
        run: |
          set -euo pipefail

          cd /var/www/aroma-qa

          git config core.fileMode false

          if [ -n "$(git status --porcelain)" ]; then
            echo "Staging server has local changes. Resetting them before deploy:"
            git status --short
            git reset --hard HEAD
          fi

          git fetch origin develop
          git pull --ff-only origin develop

          php artisan migrate --force
          php artisan optimize:clear
          php artisan route:clear
          php artisan config:clear
          php artisan view:clear
