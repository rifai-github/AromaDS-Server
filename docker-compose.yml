version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aroma_erp_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - aroma_network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: aroma_erp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/sites/:/etc/nginx/sites-available
      - ./docker/nginx/ssl/:/etc/nginx/ssl
    networks:
      - aroma_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: aroma_erp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aroma_erp
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    ports:
      - "3306:3306"
    networks:
      - aroma_network

  redis:
    image: redis:alpine
    container_name: aroma_erp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aroma_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: aroma_erp_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:80"
    networks:
      - aroma_network
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog
    container_name: aroma_erp_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - aroma_network

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

networks:
  aroma_network:
    driver: bridge
